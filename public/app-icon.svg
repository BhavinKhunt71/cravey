<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background subtle gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F0"/>
    </linearGradient>

    <!-- Persimmon / Flame gradient for the Cravey mark -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#F05A28"/>
      <stop offset="100%" stop-color="#D94816"/>
    </linearGradient>

    <!-- Obsidian dark gradient -->
    <linearGradient id="inkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1B1E"/>
      <stop offset="100%" stop-color="#0E0F11"/>
    </linearGradient>

    <!-- Subtle rim highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="craveShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#F05A28" flood-opacity="0.28"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0E0F11" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- iOS Squircle Base -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="1021" height="1021" rx="228.5" fill="none" stroke="url(#rimGrad)" stroke-width="3"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.5"/>

  <!-- Iconic Cravey Mark: Stylized geometric "C" with an elegant bite arc -->
  <g filter="url(#craveShadow)">
    <!-- Outer primary C curve -->
    <path d="M 640 290
             C 450 290 320 400 320 530
             C 320 660 450 750 640 750
             C 710 750 780 730 830 690
             C 845 678 840 655 822 648
             L 760 626
             C 745 620 726 626 715 636
             C 690 658 660 670 625 670
             C 490 670 410 590 410 520
             C 410 450 490 370 625 370
             C 660 370 690 382 715 404
             C 726 414 745 420 760 414
             L 822 392
             C 840 385 845 362 830 350
             C 780 310 710 290 640 290 Z" 
          fill="url(#flameGrad)" />

    <!-- Pure minimalist focal dot: The Sweet Craving seed / spark -->
    <circle cx="680" cy="520" r="52" fill="url(#inkGrad)" />
    <circle cx="692" cy="508" r="14" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
